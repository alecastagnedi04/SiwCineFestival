        <use
            href="#seat"
            x="48" y="520"
            width="114" height="145"/>

        <use
            href="#seat"
            x="156" y="520"
            width="114" height="145"/>

        <use
            href="#seat"
            x="264" y="520"
            width="114" height="145"/>

        <use
            href="#seat"
            x="372" y="520"
            width="114" height="145"/>

        <use
            href="#seat"
            x="480" y="520"
            width="114" height="145"/>

        <use
            href="#seat"
            x="588" y="520"
            width="114" height="145"/>

        <use
            href="#seat"
            x="696" y="520"
            width="114" height="145"/>

        <use
            href="#seat"
            x="804" y="520"
            width="114" height="145"/>

