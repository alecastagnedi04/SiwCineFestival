<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 920 620"
    preserveAspectRatio="xMidYMid slice">

    <defs>

        <!-- SFONDO BORDEAUX -->

        <radialGradient id="backGlow"
                        cx="50%" cy="42%" r="70%">

            <stop offset="0"
                  stop-color="#451c2d"/>

            <stop offset="0.52"
                  stop-color="#24101d"/>

            <stop offset="1"
                  stop-color="#110a12"/>

        </radialGradient>


        <!-- VELLUTO DELLE TENDE -->

        <linearGradient id="velvet">

            <stop offset="0"
                  stop-color="#16060d"/>

            <stop offset="0.12"
                  stop-color="#3d0c1d"/>

            <stop offset="0.26"
                  stop-color="#621930"/>

            <stop offset="0.43"
                  stop-color="#290716"/>

            <stop offset="0.58"
                  stop-color="#6b1b35"/>

            <stop offset="0.74"
                  stop-color="#3d0b20"/>

            <stop offset="0.87"
                  stop-color="#7b2740"/>

            <stop offset="1"
                  stop-color="#230814"/>

        </linearGradient>


        <!-- VELLUTO DELLE POLTRONE -->

        <linearGradient id="seatVelvet"
                        x1="0" y1="0"
                        x2="0" y2="1">

            <stop offset="0"
                  stop-color="#7e203c"/>

            <stop offset="0.24"
                  stop-color="#51162c"/>

            <stop offset="0.78"
                  stop-color="#250b19"/>

            <stop offset="1"
                  stop-color="#120811"/>

        </linearGradient>


        <!-- TENDA SINISTRA -->

        <g id="leftCurtain">

            <path
                d="
                M0 0
                H237
                C227 86 220 159 200 215
                C178 276 151 302 156 353
                C160 398 184 436 166 494
                L141 620
                H0 Z
                "
                fill="url(#velvet)"/>


            <!-- PIEGHE -->

            <path
                d="
                M8 0
                C31 139 63 275 103 345
                C111 399 67 521 59 620
                "
                fill="none"
                stroke="#ae3d54"
                stroke-opacity="0.2"
                stroke-width="20"/>


            <path
                d="
                M39 0
                C64 144 94 286 129 347
                C118 405 102 522 90 620
                "
                fill="none"
                stroke="#09030a"
                stroke-opacity="0.55"
                stroke-width="13"/>


            <path
                d="
                M89 0
                C91 155 128 272 150 337
                C142 385 150 490 128 620
                "
                fill="none"
                stroke="#c04c63"
                stroke-opacity="0.2"
                stroke-width="13"/>


            <!-- CORDONCINO DORATO -->

            <path
                d="M0 344 Q87 382 159 354"
                fill="none"
                stroke="#c5a269"
                stroke-width="5"/>


            <path
                d="M0 350 Q88 394 158 362"
                fill="none"
                stroke="#553012"
                stroke-width="4"/>


            <!-- NODO -->

            <circle
                cx="155"
                cy="357"
                r="9"
                fill="#d7b477"
                stroke="#775128"
                stroke-width="3"/>


            <!-- NAPPINA -->

            <path
                d="M155 366 Q146 395 151 411"
                fill="none"
                stroke="#b58a4d"
                stroke-width="3"/>


            <path
                d="
                M149 410
                L144 436
                L158 435
                L154 409 Z
                "
                fill="#b58a4d"/>

        </g>


        <!-- MODELLO POLTRONA -->

        <g id="seat">

            <path
