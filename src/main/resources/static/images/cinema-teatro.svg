        <use href="#seat" x="162" y="455"/>
        <use href="#seat" x="250" y="455"/>
        <use href="#seat" x="338" y="455"/>
        <use href="#seat" x="426" y="455"/>
        <use href="#seat" x="514" y="455"/>
        <use href="#seat" x="602" y="455"/>
        <use href="#seat" x="690" y="455"/>
        <use href="#seat" x="778" y="455"/>
        <use href="#seat" x="866" y="455"/>

    </g>



    <!-- SECONDA FILA POLTRONE -->

    <g opacity="0.93">

        <use
            href="#seat"
            x="-60" y="520"
